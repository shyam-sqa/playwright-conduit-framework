name: Playwright Quality Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '30 1 * * 1-5'
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to execute
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke
          - regression
          - api
          - cross-browser

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static quality gates
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check

  test:
    name: Playwright tests
    needs: quality
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      SELECTED_SUITE: ${{ inputs.suite || 'full' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run selected Playwright suite
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            npm run test:regression
          else
            case "$SELECTED_SUITE" in
              smoke) npm run test:smoke ;;
              regression) npm run test:regression ;;
              api) npm run test:api ;;
              cross-browser) npm run test:cross-browser ;;
              full) npm test ;;
              *) echo "Unknown suite: $SELECTED_SUITE"; exit 1 ;;
            esac
          fi
      - name: Add run summary
        if: always()
        run: |
          {
            echo "## Playwright execution"
            echo "- Result: **${{ job.status }}**"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Requested suite: \`$SELECTED_SUITE\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Reports: download the artifacts attached to this run"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 30
      - name: Upload test evidence
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
